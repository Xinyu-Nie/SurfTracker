name: Binary download checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-download-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  downloads:
    name: Linux / Python 3.12 binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit public tree, downloads and source exclusions
        run: |
          python -m pip install docutils
          python scripts/check_public_repository.py --check-rst --json validation/repository.json
      - name: Install the checked binary and pinned dependencies
        run: |
          python -m pip install --only-binary=:all: -c binaries/0.3.0.dev18/requirements-validation.txt binaries/0.3.0.dev18/*.whl
          python -m pip check
      - name: Check command and module interfaces
        run: |
          swmtrack doctor
          swmtrack run --help
          python -m swmtrack run --help
      - name: Run the synthetic example and check installed native behavior
        run: |
          python scripts/synthetic_demo.py --output-dir "$RUNNER_TEMP/surftracker-synthetic"
          python scripts/validate_installation.py --demo "$RUNNER_TEMP/surftracker-synthetic/demo.json" --json validation/installation.json
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-download-validation
          path: validation/
          retention-days: 14
