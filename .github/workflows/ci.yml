name: Package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    defaults:
      run:
        shell: bash
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and runtime dependencies
        run: python -m pip install '.[test,release]'
      - name: Build distributions
        run: python -m build
      - name: Check archive contents and README rendering
        run: |
          python scripts/check_distributions.py dist/*.whl dist/*.tar.gz --json release-audit/archives.json
          python -m twine check --strict dist/*
      - name: Test extracted source and installed wheel outside checkout
        run: |
          python scripts/verify_artifacts.py --wheel dist/*.whl --sdist dist/*.tar.gz --output-dir release-audit/artifact-tests
      - name: Run synthetic prepare and tracking example
        run: python scripts/synthetic_demo.py --output-dir "$RUNNER_TEMP/swmtrack-demo" --n-seeds 256
      - name: Save distributions and verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/
            release-audit/
          if-no-files-found: warn
